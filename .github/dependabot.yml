# Dependabot: actualizaciones semanales de dependencias (Sprint 5, punto 5.4).
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

# Todos los PR van contra `develop` (C-16): `main` recibe solo releases, y un
# PR de dependencias contra `main` se saltea `develop` y su CI.

version: 2
updates:
  - package-ecosystem: 'npm'
    target-branch: 'develop'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      npm-minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'docker'
    target-branch: 'develop'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Node se fija en .nvmrc, engines y Dockerfile (src/test/nodeVersion.test.ts
    # exige que coincidan). Los majors se suben a mano, y solo a versiones LTS.
    ignore:
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    target-branch: 'develop'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns:
          - '*'
