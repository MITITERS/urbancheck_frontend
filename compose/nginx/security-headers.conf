# Cabeceras de seguridad del panel (C-05). Se incluye en el `server` y en cada
# `location` que tenga su propio `add_header`: nginx no hereda las cabeceras de
# un bloque al que ya le agregó otra. `always` las manda también en los 4xx y
# 5xx. El HSTS no va acá: lo agrega Traefik, que es quien termina el TLS.

# La política de contenido. Estuvo en modo informe hasta recorrer con
# Playwright las pantallas de los dos roles sin violaciones (22/10/2026). Las
# teselas del mapa son lo único que llega de afuera; la
# API, allauth y las fotos van por el mismo origen (este mismo nginx). Los
# estilos admiten 'unsafe-inline' porque los inyectan en tiempo de ejecución
# sonner (los avisos) y los gráficos de shadcn: los scripts siguen sin inline
# ni eval.
add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# El panel no pide ubicación, cámara ni micrófono: elegir un punto del mapa es
# hacer clic, no geolocalizar.
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
